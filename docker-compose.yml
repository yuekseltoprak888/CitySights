services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-energyos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energyos}
      POSTGRES_DB: ${POSTGRES_DB:-energyos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energyos} -d ${POSTGRES_DB:-energyos}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-energyos}:${POSTGRES_PASSWORD:-energyos}@db:5432/${POSTGRES_DB:-energyos}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      ADDRESS_PROVIDER: mock
      BUILDING_DATA_PROVIDER: mock
      SOLAR_POTENTIAL_PROVIDER: mock
      WEATHER_PROVIDER: mock
      TARIFF_PROVIDER: mock
      SUBSIDY_PROVIDER: mock
      LOG_LEVEL: info
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: ./apps/web
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  web_node_modules:
